<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draw</title>
    <link rel="stylesheet" href="../../styles/main.css" />
  </head>

  <body class="bg-gray-950">
    <main class="flex min-h-screen flex-col items-center justify-center gap-4 p-4">
      <a href="/" class="fixed left-4 top-4 rounded-full bg-white px-4 py-2 text-sm font-medium text-gray-900">
        Inicio
      </a>

      <canvas
        class="h-[70vh] w-full max-w-6xl cursor-crosshair border-[10px] border-amber-900 bg-white"
        id="canvas"
      ></canvas>

      <div class="flex w-full max-w-6xl flex-wrap items-center justify-center gap-3 rounded-lg bg-amber-900 p-4">
        <button class="h-12 w-12 rounded-full border-4 border-black bg-black" data-color="black"></button>
        <button class="h-12 w-12 rounded-full border-4 border-black bg-white" data-color="white"></button>
        <button class="h-12 w-12 rounded-full border-4 border-black bg-red-600" data-color="red"></button>
        <button class="h-12 w-12 rounded-full border-4 border-black bg-blue-600" data-color="blue"></button>
        <button class="h-12 w-12 rounded-full border-4 border-black bg-green-600" data-color="green"></button>
        <button class="h-12 w-12 rounded-full border-4 border-black bg-yellow-600" data-color="yellow"></button>
        <button class="h-12 w-12 rounded-full border-4 border-black bg-purple-600" data-color="purple"></button>
        <button class="h-12 w-12 rounded-full border-4 border-black bg-pink-600" data-color="pink"></button>
        <button class="h-12 w-12 rounded-full border-4 border-black bg-orange-600" data-color="orange"></button>
        <button class="h-12 w-12 rounded-full border-4 border-black bg-gray-600" data-color="gray"></button>
        <button
          class="rounded-full border-4 border-black bg-white px-5 py-3 font-medium text-gray-900"
          id="clear"
          type="button"
        >
          Limpar
        </button>
      </div>
    </main>

    <script type="module" src="./index.js"></script>
  </body>
</html>
