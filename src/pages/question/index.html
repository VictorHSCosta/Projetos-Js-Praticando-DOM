<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question</title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body class="bg-gray-100">
    <main class="flex min-h-screen flex-col items-center justify-center px-4">
      <a href="/" class="fixed left-4 top-4 rounded-full bg-white px-4 py-2 text-sm font-medium text-gray-900">
        Inicio
      </a>

      <section class="w-full max-w-xl rounded-lg bg-white p-6 shadow-sm">
        <p class="text-sm font-semibold uppercase tracking-wide text-blue-700">Question</p>
        <h1 class="mt-2 text-3xl font-bold text-gray-900" id="question-title"></h1>

        <div class="mt-8 flex flex-col gap-3" id="options"></div>

        <div class="mt-6 hidden rounded-lg border p-4 text-lg font-medium" id="result"></div>

        <div class="mt-6 flex items-center justify-between">
          <p class="text-sm text-gray-500" id="progress"></p>
          <button class="rounded-full bg-blue-700 px-5 py-2 font-medium text-white" id="next" type="button">
            Proxima
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="./index.js"></script>
  </body>
</html>
