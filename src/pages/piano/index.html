<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano</title>
    <link rel="stylesheet" href="../../styles/main.css" />
  </head>
  <body class="flex min-h-screen flex-col items-center justify-center gap-10 bg-gray-900 px-4">
    <a
      href="/"
      class="fixed left-4 top-4 rounded-full bg-white px-4 py-2 text-sm font-medium text-gray-900"
    >
      Inicio
    </a>

    <div class="grid w-full max-w-96 grid-cols-2 gap-4" id="piano">
      <div
        class="bg-blue-100 hover:bg-blue-200 text-blue-900 p-3 text-2xl rounded-xl flex h-32 justify-center align-middle items-center"
        id="a"
      >
        DO
      </div>
      <div
        class="bg-emerald-100 hover:bg-emerald-200 text-emerald-900 p-3 text-2xl rounded-xl flex h-32 justify-center align-middle items-center"
        id="s"
      >
        RÉ
      </div>
      <div
        class="bg-purple-100 hover:bg-purple-200 text-purple-900 p-3 text-2xl rounded-xl flex h-32 justify-center align-middle items-center"
        id="d"
      >
        MI
      </div>
      <div
        class="bg-orange-100 hover:bg-orange-200 text-orange-900 p-3 text-2xl rounded-xl flex h-32 justify-center align-middle items-center"
        id="f"
      >
        FA
      </div>
      <div
        class="bg-pink-100 hover:bg-pink-200 text-pink-900 p-3 text-2xl rounded-xl flex h-32 justify-center align-middle items-center"
        id="g"
      >
        SOL
      </div>
      <div
        class="bg-yellow-100 hover:bg-yellow-200 text-yellow-900 p-3 text-2xl rounded-xl flex h-32 justify-center align-middle items-center"
        id="h"
      >
        LA
      </div>
      <div
        class="bg-slate-100 hover:bg-slate-200 text-slate-900 p-3 text-2xl rounded-xl flex h-32 justify-center align-middle items-center"
        id="j"
      >
        SI
      </div>
      <div
        class="bg-gray-100 hover:bg-gray-200 text-gray-900 p-3 text-2xl rounded-xl flex h-32 justify-center align-middle items-center"
        id="k"
      >
        DO
      </div>
    </div>

    <div class="flex gap-2">
      <input
        type="text"
        class="py-2 px-5 rounded-full text-gray-900"
        id="notesToPlay"
        placeholder="Ex: asdfghj"
      />
      <button class="text-green-500" id="button_play">
        <div id="play">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-play-icon lucide-play"
          >
            <path
              d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
            />
          </svg>
        </div>
        <div class="text-red-600 hidden" id="stop">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-square-icon lucide-square"
          >
            <rect width="18" height="18" x="3" y="3" rx="2" />
          </svg>
        </div>
      </button>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
