<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="../../styles/main.css" />
    <script src="./index.js" defer></script>
  </head>
  <body
    class="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-6 font-sans"
  >
    <!-- Cabeçalho do Jogo -->
    <div class="text-center mb-8">
      <h1
        class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-primary-400 to-indigo-400 bg-clip-text text-transparent"
      >
        Jogo da Velha
      </h1>
      <p id="game_status" class="text-slate-400 mt-2 text-lg font-medium">
        Insira o nome do jogador para começar!
      </p>
    </div>

    <!-- Tabuleiro do Jogo -->
    <div
      class="grid grid-cols-3 gap-3 w-full max-w-[320px] aspect-square p-2 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl mb-8"
    >
      <button
        class="bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 text-4xl font-bold rounded-xl flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95 text-white h-24 w-24"
      ></button>
      <button
        class="bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 text-4xl font-bold rounded-xl flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95 text-white h-24 w-24"
      ></button>
      <button
        class="bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 text-4xl font-bold rounded-xl flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95 text-white h-24 w-24"
      ></button>
      <button
        class="bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 text-4xl font-bold rounded-xl flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95 text-white h-24 w-24"
      ></button>
      <button
        class="bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 text-4xl font-bold rounded-xl flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95 text-white h-24 w-24"
      ></button>
      <button
        class="bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 text-4xl font-bold rounded-xl flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95 text-white h-24 w-24"
      ></button>
      <button
        class="bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 text-4xl font-bold rounded-xl flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95 text-white h-24 w-24"
      ></button>
      <button
        class="bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 text-4xl font-bold rounded-xl flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95 text-white h-24 w-24"
      ></button>
      <button
        class="bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 text-4xl font-bold rounded-xl flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95 text-white h-24 w-24"
      ></button>
    </div>

    <!-- Botão de Reiniciar -->
    <button
      id="reset_btn"
      class="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold rounded-xl transition-all duration-200 active:scale-95"
    >
      Reiniciar Partida
    </button>

    <!-- Modal Inicial (Centralizado com Backdrop Blur) -->
    <div
      id="initial_modal"
      class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 transition-opacity duration-300"
    >
      <!-- Card do Modal -->
      <div
        class="relative w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-8 transform transition-transform duration-300 scale-100"
      >
        <!-- Botão Fechar (X) -->
        <button
          id="close_modal"
          class="absolute top-5 right-5 text-slate-400 hover:text-slate-200 transition-colors p-2 rounded-full hover:bg-slate-800"
          aria-label="Fechar"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>

        <!-- Conteúdo do Modal -->
        <div class="text-center mb-6">
          <div
            class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-primary-500/10 text-primary-400 mb-4 border border-primary-500/20"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-white tracking-tight">Digite seu nome de usuário</h2>
          <p class="text-sm text-slate-400 mt-1">Para personalizar sua experiência de jogo</p>
        </div>

        <!-- Formulário do Modal -->
        <div class="space-y-4">
          <div>
            <label
              for="username_input"
              class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2"
              >Nome de Usuário</label
            >
            <input
              type="text"
              id="username_input"
              placeholder="Ex: Jogador 1"
              class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700 focus:border-primary-500 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20 transition-all duration-200"
            />
          </div>

          <button
            id="start_game"
            class="w-full py-3 mt-2 bg-primary-600 hover:bg-primary-500 text-white font-semibold rounded-xl transition-all duration-200 shadow-lg shadow-primary-600/20 hover:shadow-primary-600/40 active:scale-[0.98]"
          >
            Começar a Jogar
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
